name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        # The live-hub tests are behind the "live" build tag and never run
        # here: CI has no hub. Everything else runs against captures,
        # oracle vectors and the simulated hub.
        run: go test -race ./...

  fuzz:
    name: Fuzz (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Fuzz every target briefly
        # Every decoder of hub input has a fuzz target; a short run per
        # target catches panics on malformed frames. Long runs are local
        # (make fuzz FUZZTIME=10m).
        run: make fuzz FUZZTIME=15s

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }}${{ matrix.goarm && format('/v{0}', matrix.goarm) || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - {goos: linux,   goarch: amd64}
          - {goos: linux,   goarch: arm64}
          - {goos: linux,   goarch: arm,   goarm: "7"}
          # Windows
          - {goos: windows, goarch: amd64}
          - {goos: windows, goarch: arm64}
          # macOS
          - {goos: darwin,  goarch: amd64}
          - {goos: darwin,  goarch: arm64}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Cross-compile
        env:
          GOOS:        ${{ matrix.goos }}
          GOARCH:      ${{ matrix.goarch }}
          GOARM:       ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          VERSION=$(git describe --tags --dirty --always 2>/dev/null || echo "dev")
          go build -ldflags "-s -w -X main.version=${VERSION}" ./cmd/sbx
          go vet ./...

      - name: Verify go.mod is tidy
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        # Add go.sum to the diff once the module has its first dependency.
        run: |
          go mod tidy
          git diff --exit-code go.mod

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Run golangci-lint
        run: golangci-lint run --timeout 5m

  # Summary job so branch-protection can require a single "Build" check
  # instead of one entry per matrix combination.
  build-summary:
    name: Build
    needs: [build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all builds passed
        run: |
          if [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "One or more cross-compile jobs failed"
            exit 1
          fi
